{% extends 'base.html' %}{% block title %}Create account | Epah Scholarship{% endblock %}{% block content %}<div class="form-wrap"><p class="eyebrow">JOIN THE COMMUNITY</p><h1>Create your account</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Account type<select name="role"><option value="student">Student</option><option value="institution">Institution</option></select></label><label>Full name / institution name<input name="full_name" required maxlength="140"></label><label>Email address<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="8" required></label><button class="button full">Create account</button></form><p class="muted">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p></div>{% endblock %}
