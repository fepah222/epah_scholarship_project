{% extends 'base.html' %}{% block content %}
<div class="form-wrap wide"><h1>Your student profile</h1>
{% if current_user.profile_photo %}<img src="{{ url_for('media_file', filename=current_user.profile_photo) }}" alt="Profile photo" style="width:110px;height:110px;object-fit:cover;border-radius:50%">{% endif %}
<form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
{% for field in ['country','region','city','current_institution','education_level','field_of_study'] %}<label>{{ field.replace('_',' ').title() }}<input name="{{ field }}" value="{{ getattr(profile,field,'') or '' }}"></label>{% endfor %}
<label>Biography<textarea name="biography">{{ profile.biography or '' }}</textarea></label>
<label>Profile photo (JPG, PNG or WEBP, maximum 8 MB)<input type="file" name="profile_photo" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"></label>
<button class="button">Save profile</button></form></div>{% endblock %}
