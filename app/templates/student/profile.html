{% extends 'base.html' %}{% block content %}<div class="form-wrap wide"><h1>Your student profile</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% for field in ['country','region','city','current_institution','education_level','field_of_study'] %}<label>{{ field.replace('_',' ').title() }}<input name="{{ field }}" value="{{ getattr(profile,field,'') or '' }}"></label>{% endfor %}<label>Biography<textarea name="biography">{{ profile.biography or '' }}</textarea></label><button class="button">Save profile</button></form></div>{% endblock %}
