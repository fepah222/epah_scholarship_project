{% extends 'base.html' %}{% block content %}<h1>Conversation</h1><div id="chat" class="chat-box" data-conversation="{{ conversation_id }}">{% for m in messages %}<div class="chat-message"><b>{{ m.sender.full_name }}</b><p>{{ m.message_text }}</p><small>{{ m.sent_at }}</small></div>{% endfor %}</div><form id="chatForm" class="chat-send"><input id="chatInput" placeholder="Write a message..." autocomplete="off"><button class="button">Send</button></form><p id="chatStatus" class="muted">Connecting to secure messaging…</p><script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script><script src="{{ url_for('static',filename='js/chat.js') }}" defer></script>{% endblock %}
