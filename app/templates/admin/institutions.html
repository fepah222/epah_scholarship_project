{% extends 'base.html' %}{% block content %}<h1>Institution verification</h1>{% for i in institutions %}<article class="card"><h3>{{ i.institution_name }}</h3><p>{{ i.city or '' }} {{ i.country or '' }} · {{ i.verification_status }}</p><form method="post" action="{{ url_for('admin.review_institution',institution_id=i.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input name="reason" placeholder="Review reason"><button class="button small" name="status" value="approved">Approve</button><button class="button danger small" name="status" value="rejected">Reject</button></form></article>{% else %}<p>No institutions.</p>{% endfor %}{% endblock %}
