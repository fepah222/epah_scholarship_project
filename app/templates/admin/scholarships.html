{% extends 'base.html' %}{% block content %}<h1>Scholarship review</h1>{% for s in scholarships %}<article class="card"><h3>{{ s.title }}</h3><p>{{ s.institution.institution_name }} · {{ s.approval_status }}</p><form method="post" action="{{ url_for('admin.review_scholarship',scholarship_id=s.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input name="reason" placeholder="Reason if rejected"><button class="button small" name="status" value="approved">Approve</button><button class="button danger small" name="status" value="rejected">Reject</button></form></article>{% else %}<p>No scholarship submissions.</p>{% endfor %}{% endblock %}
