name: Python dependency installation and tests

on:
  push:
    branches:
      - main
      - feature/scholarship-workflow
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-test:
    name: Install dependencies and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install every project dependency
        run: python -m pip install -r requirements.txt

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Run automated test suite
        env:
          SECRET_KEY: github-actions-test-key
          DATABASE_URL: sqlite:///ci-test.db
        run: python -m pytest -q
